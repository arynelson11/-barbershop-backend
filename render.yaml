services:
  # Banco de dados PostgreSQL
  - type: pserv
    name: barbershop-db
    env: docker
    plan: free
    region: oregon
    databases:
      - name: barbershop
        databaseName: barbershop
        user: barbershop_user

  # Aplicação Node.js
  - type: web
    name: barbershop-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: barbershop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
